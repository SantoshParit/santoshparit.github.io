project:
  type: website

website:
  title: "Your Name"
  description: "AI Engineer | Former Bosch Software Architect"
  site-url: "https://github.io"
  
  # A clean, elegant top navigation bar
  navbar:
    background: light
    collapse: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About

format:
  html:
    # Moved theme inside format -> html
    theme: 
      light: [cosmo]
      dark: [darkly]
    toc: true            # Generates a clean table of contents for deep articles
    execute:
      eval: false
    code-fold: true      # Lets readers expand/collapse raw Python/C++ code blocks
    code-copy: true      # Adds a "Copy Code" button to snippets
