name: Quarto Publish

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    # Explicitly lock to 24.04 to bypass the recent October 2026 ubuntu-latest breaking updates
    runs-on: ubuntu-24.04 
    
    # CRITICAL: Grant the token permission to push files to the gh-pages branch
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Python Dependencies
        run: |
          pip install ipykernel jupyter

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
